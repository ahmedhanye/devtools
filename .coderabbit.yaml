# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: >-
  Be concise, objective, and direct. Focus strictly on architecture boundaries,
  correctness, type safety, security, and runtime performance.
  Provide minimal, copy-pasteable diffs without conversational filler.

reviews:
  profile: "chill"
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  sequence_diagrams: true
  review_status: true
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    base_branches:
      - ".*"
    ignore_title_keywords:
      - "WIP"
      - "wip"
      - "Draft"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  pre_merge_checks:
    title:
      mode: "error"
      requirements: >-
        Deterministic CI already checks PR title syntax, allowed types, scope syntax, and length.
        Focus strictly on semantic and logical alignment between the PR title and the actual diff:
        1. Type matches the delivered change: `feat` for end-user runtime capabilities, `fix` for runtime bug fixes or security dependency patches (`fix(deps)`), `perf` for runtime performance, `ci` (preferred over `chore(ci)`) for CI/workflow changes, and non-releasing types (`docs`, `chore`, `refactor`, `style`, `test`, `build`) for internal or documentation work.
        2. Release safety: fail if a non-runtime change (`site`, `docs`, `.agents`, `scripts`, `.github`) uses a release-triggering type (`feat`, `fix`, `perf`, `revert`)—especially when root files like `package.json` or `bun.lock` are also modified.
        3. Canonical scope consistency: when a scope is present, verify it matches the primary delivered area and uses canonical workspace names (`api`, `cli`, `frontend`, `browser`, `core`, `db`, `lighthouse`, `site`, `deps`) rather than synonyms (for example, flag `ui` or `web` in favor of `frontend`, `lh` in favor of `lighthouse`). Clear domain or sub-scopes (such as `cli/audit`) and omitted scopes for cross-cutting changes are allowed.
        4. Summary accuracy: verify the title description accurately reflects the primary change delivered by the PR.
        Exception: Release Please candidate PRs (`chore(main): release X.Y.Z`).
    description:
      mode: "error"
      requirements: >-
        Non-bot, ready-for-review PR descriptions must follow `.github/PULL_REQUEST_TEMPLATE.md`
        (`## Summary`, `## Evidence`, and `## Merge Danger`) and link a tracking issue via
        `Closes #<issue>` or `Part of #<issue>`.
    custom_checks:
      - name: "Feature-Sliced Design (FSD) Layer Purity"
        mode: "error"
        instructions: >-
          Verify that frontend code under `apps/frontend/src` strictly follows architectural boundaries:
          1. Imports flow strictly downwards: app -> pages -> shared.
          2. Slices in the same layer must not import directly from each other.
          3. Slices must be imported only through their public API entry point (`index.ts`).
      - name: "No Hardcoded Secrets or Credentials"
        mode: "error"
        instructions: >-
          Ensure that no plaintext API secrets, tokens, private keys, database connection
          strings with passwords, or sensitive environment values are committed in diffs.

  path_filters:
    - "!bun.lock"
    - "!**/bun.lock"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!yarn.lock"
    - "!apps/**/dist/**"
    - "!apps/**/.next/**"
    - "!dist/**"
    - "!build/**"
    - "!out/**"
    - "!storybook-static/**"
    - "!apps/frontend/next-env.d.ts"
    - "!site/dist/**"
    - "!site/.next/**"
    - "!site/.source/**"
    - "!site/next-env.d.ts"
    - "!tmp/**"
    - "!.scratch/**"
    - "!**/.fallow/**"
    - "!**/coverage/**"
    - "!**/.turbo/**"
    - "!skills-lock.json"
    - "!.agents/skills/codebase-design/**"
    - "!.agents/skills/fallow/**"
    - "!.agents/skills/feature-sliced-design/**"
    - "!.agents/skills/grill-with-docs/**"
    - "!.agents/skills/prototype/**"
    - "!.agents/skills/react-doctor/**"
    - "!.agents/skills/tdd/**"
    - "!.agents/skills/unslop/**"
    - "!.agents/skills/wait-what/**"
    - "!**/*.{png,jpg,jpeg,gif,svg,ico,woff,woff2,ttf,eot,mp4,webm}"
    - "!**/*.min.{js,css}"
    - "!**/*.map"

  path_instructions:
    - path: "apps/frontend/**"
      instructions: >-
        This package is a Next.js App Router frontend governed by strict Feature-Sliced Design (v2.1).
        Enforce the following:
        1. FSD Hierarchy: layers strictly descend (app -> pages -> shared).
           Never import from an upper layer into a lower layer.
        2. Encapsulation: Access slices strictly through their public API (`index.ts`). Never import internal files.
        3. UI & Styling: Use `@base-ui/react` primitives for accessible UI components.
           Enforce Tailwind CSS utility classes with the `cn()` helper.
           Strictly forbid inline `style={{ ... }}` and hardcoded raw color literals (e.g. `text-[#fff]`, `bg-red-500`).
        4. React 19: Keep Client Components (`'use client'`) at tree leaves. Avoid unnecessary useEffect or re-renders.

    - path: "apps/api/**"
      instructions: >-
        This package is a vertical-slice Hono API service (`src/app/`, `src/modules/`, `src/shared/`).
        Enforce the following:
        1. Slice Isolation: Cross-module and shared imports must go through slice `index.ts` barrels (`app -> modules (isolated) -> shared`) enforced by `.fallowrc.json` and Oxlint `no-restricted-imports`.
        2. Input Validation: Validate all incoming request bodies, query params, and route parameters
           using Zod/validator middleware prior to execution.
        3. Thin Controllers: Route handlers must delegate business logic to domain packages (such as `packages/lighthouse`) and never import `node:fs` directly inside HTTP routes (isolate disk reads in helpers like `report-reader.ts`).
        4. HTTP Semantics: Return appropriate HTTP status codes (200, 201, 400, 401, 403, 404, 500)
           and structured JSON error responses (`jsonApiError`).

    - path: "packages/db/**"
      instructions: >-
        This package manages database models and migrations via Drizzle ORM.
        Enforce the following:
        1. Type Safety: Use Drizzle query builders and prepared statements; strictly forbid raw unescaped SQL.
        2. Migrations & Parity: All schema modifications must be accompanied by generated Drizzle migrations and pass `bun run verify:db-migrations`.
        3. Integrity: Ensure indexes are defined on foreign keys and frequently queried columns.
        4. Transactions: Multi-table writes must be wrapped inside `db.transaction()`.

    - path: "apps/cli/**"
      instructions: >-
        This package provides command-line developer tooling organized into vertical command slices (`src/app/`, `src/commands/`, `src/shared/`).
        Enforce clean exit codes (0 for success, non-zero for failure), pipe-friendly stdout,
        informative stderr diagnostics, slice barrel isolation (`index.ts`), and graceful exception handling.

    - path: "packages/core/**"
      instructions: >-
        This package provides canonical domain schemas, types, and error definitions.
        Enforce the following:
        1. Pure Domain: Zero runtime dependencies on database clients, HTTP servers, or browser/UI frameworks.
        2. Schema Authority: Export canonical Zod schemas and derived TypeScript types for cross-package contracts.
        3. Stable Contracts: Maintain backward-compatible schema changes and explicit curated barrel exports.

    - path: "packages/browser/**"
      instructions: >-
        This package provides Chromium browser provisioning, detection, and isolated session launching infrastructure.
        Enforce the following:
        1. 3-Tier Waterfall: Strict resolution order (explicit flag/env -> managed cache & system probes -> terminal remediation failure).
        2. Session & Sandbox Isolation: Launch Chromium via `launchBrowserSession` (`ignoreDefaultFlags: true`, `handleSIGINT: false`) and policy helpers (`resolveChromeSandboxDisabled`).
        3. Clean Seams: Mock external download and launcher operations (@puppeteer/browsers, chrome-launcher) in tests to guarantee offline test isolation.
        4. Stable Contracts: Export public contracts (resolveBrowserPath, installBrowser, getBrowserStatus, launchBrowserSession, resolveChromeSandboxDisabled, types, errors) via `index.ts`.

    - path: "packages/lighthouse/**"
      instructions: >-
        This package provides the isolated Lighthouse v13 audit engine, metric extraction, and persistence services structured as hexagonal internal layers (`contracts/`, `domain/`, `application/`, `config/`, `infra/`, `wiring.ts`).
        Enforce the following:
        1. Layering Purity: Keep `contracts/`, `domain/`, and `application/` free of runtime infra, SQLite, browser, or `node:fs` calls; wire runtime ports in `src/wiring.ts`.
        2. In-Process Execution & Chromium Cleanup: Delegate browser session lifecycle to `launchBrowserSession` (`@devtools/browser`) with AbortSignal cancellation and batch browser resolution once per multi-run audit per ADR 0005.
        3. Configuration Seam: Isolate environment variable reads inside `src/config/artifacts-config.ts` (`resolveArtifactsDir`) with injectable `options.env?: EnvMap` per ADR 0002.
        4. Representative Selection: Select a single Representative Run via Euclidean distance to median FCP and TTI rather than computing independent per-metric medians.

    - path: "site/**"
      instructions: >-
        This package is the Fumadocs documentation platform application.
        Enforce the following:
        1. Diátaxis documentation structure across tutorials, how-to, reference, and explanation.
        2. Clean MDX formatting and Fumadocs UI component usage.
        3. Zero phantom dependencies: declare all dependencies directly in site/package.json.

    - path: ".github/workflows/**"
      instructions: >-
        Enforce secure CI/CD practices:
        1. Pin actions to full commit SHAs or trusted releases.
        2. Apply least privilege to `permissions:` blocks.
        3. Use Bun (`bun`/`bunx`) for package execution and cache setups.

  tools:
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: true
    reactDoctor:
      enabled: true
    ast-grep:
      enabled: true
      essential_rules: true
    github-checks:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    zizmor:
      enabled: true
    skillspector:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".agents/AGENTS.md"
      - "GLOSSARY.md"
      - "docs/glossary/*"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "docs/adr/*"
  learnings:
    scope: "local"
    approval_delay: 0
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
  web_search:
    enabled: true

chat:
  auto_reply: true
  art: false
