# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: >-
  Be concise, direct, and objective. Prefer minimal copy-pasteable diffs
  over prose and skip pleasantries.

reviews:
  profile: "chill"
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  sequence_diagrams: true
  review_status: true
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 3
    base_branches:
      - ".*"
    ignore_title_keywords:
      - "WIP"
      - "Draft"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  pre_merge_checks:
    title:
      mode: "error"
      requirements: >-
        Deterministic CI already checks PR title syntax, allowed types, scope syntax, and length.
        Check semantic alignment between the PR title and the actual diff:
        1. Type matches the delivered change: `feat` for end-user runtime capabilities, `fix` for runtime bug fixes or security dependency patches (`fix(deps)`), `perf` for runtime performance, `ci` (preferred over `chore(ci)`) for CI/workflow changes, and non-releasing types (`docs`, `chore`, `refactor`, `style`, `test`, `build`) for internal or documentation work.
        2. Release safety: fail if non-runtime changes (`site`, `docs`, `.agents`, `scripts`, `.github`) use a release-triggering type (`feat`, `fix`, `perf`, `revert`)—especially when root `package.json` or `bun.lock` is also modified.
        3. Canonical scope: when present, match the primary delivered workspace (`api`, `cli`, `frontend`, `browser`, `core`, `db`, `lighthouse`, `site`, `deps`) rather than synonyms (e.g., flag `ui` or `web` -> `frontend`, `lh` -> `lighthouse`). Clear sub-scopes (such as `cli/audit`) and omitted scopes for cross-cutting PRs are allowed.
        4. Summary accuracy: verify the title summary accurately reflects the primary change delivered by the PR.
        Exception: Release Please candidate PRs (`chore(main): release X.Y.Z`).
    description:
      mode: "error"
    issue_assessment:
      mode: "warning"

  # CodeRabbit built-in defaults already exclude *.lock, package-lock.json,
  # pnpm-lock.yaml, yarn.lock, **/dist/**, **/.next/**, media/fonts,
  # *.min.{js,css}, and *.map. Keep only repo-specific exclusions here.
  path_filters:
    - "!build/**"
    - "!out/**"
    - "!storybook-static/**"
    - "!**/next-env.d.ts"
    - "!site/.source/**"
    - "!tmp/**"
    - "!.scratch/**"
    - "!**/.fallow/**"
    - "!**/coverage/**"
    - "!**/.turbo/**"
    - "!skills-lock.json"

  path_instructions:
    - path: "**/*"
      instructions: >-
        Skip formatting, import sorting, style nits, dead code, FSD/monorepo import
        boundaries, and TypeScript strictness checks—CI enforces them with Prettier,
        Oxlint, Steiger, Fallow, React Doctor, and tsc. Focus on correctness, runtime
        bugs, security, concurrency/teardown safety, and contract violations. Mention
        repeated patterns once at summary level.

    - path: "apps/frontend/**"
      instructions: >-
        1. Keep `'use client'` boundaries at tree leaves rather than wrapping server
           layouts/pages.
        2. Avoid inline `style={{ ... }}` and hardcoded raw color literals (use
           Semantic Theme Tokens with Tailwind utilities).

    - path: "packages/db/**"
      instructions: >-
        1. Use Drizzle query builders / parameterized queries; flag any raw unescaped SQL.
        2. Wrap multi-table writes in `db.transaction()`.
        3. Flag missing indexes on new foreign keys or frequently filtered columns.

    - path: "packages/lighthouse/**"
      instructions: >-
        1. Select a single Representative Run via Euclidean distance to median FCP
           and TTI—never compute independent per-metric medians.
        2. Resolve the browser binary once per multi-run batch and honor
           `AbortSignal` cancellation for Chromium session cleanup.

  # Enable only tools that run here and add signal beyond GitHub Actions CI.
  # CI already enforces Oxlint, React Doctor, TruffleHog, actionlint, ShellCheck,
  # and zizmor (CodeRabbit auto-skips tools detected in CI or missing configs).
  tools:
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    reactDoctor:
      enabled: false
    trufflehog:
      enabled: false
    zizmor:
      enabled: false
    actionlint:
      enabled: false
    shellcheck:
      enabled: false
    markdownlint:
      enabled: false
    ast-grep:
      enabled: true
      essential_rules: true
    github-checks:
      enabled: true
    gitleaks:
      enabled: true
    skillspector:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CODING_STANDARDS.md"
      - "TESTING.md"
      - "ARCHITECTURE.md"
  learnings:
    scope: "local"
    approval_delay: 0
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
  web_search:
    enabled: true

chat:
  auto_reply: true
  art: false
