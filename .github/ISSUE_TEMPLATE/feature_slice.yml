name: Feature Slice
description: Propose or track an atomic vertical slice delivering end-to-end functionality for a parent Spec
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        A **Feature Slice** (Ticket) delivers end-to-end functionality across public seams in a single unit of work.

        > **Linking Parent Spec:** Link this ticket to its parent Spec using GitHub's native Sub-Issues (`Add sub-issue` in the issue sidebar, or `gh api repos/:owner/:repo/issues/<spec_number>/sub_issues -F sub_issue_id=<ticket_id>`). Do not assign milestones to Tickets (milestones belong strictly to Specs).
  - type: dropdown
    id: area
    attributes:
      label: Primary Affected Area
      description: Select the primary package or component for this vertical slice.
      options:
        - "@devtools/cli"
        - "@devtools/api"
        - "@devtools/frontend"
        - "@devtools/browser"
        - "@devtools/lighthouse"
        - "@devtools/core"
        - "@devtools/db"
        - "@devtools/site"
        - "toolchain / infra"
    validations:
      required: true
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: What specific user pain point, missing capability, or technical defect does this slice address?
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: behavioral_contract
    attributes:
      label: Expected Behavioral Contract
      description: What observable behavioral contracts, public seams, and user-facing capabilities will hold when this slice is complete? State the problem and expected outcome without prescribing internal mechanics, implementation recipes, or rules already in CODING_STANDARDS.md or TESTING.md.
      placeholder: Describe observable behavior...
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Automated Acceptance Criteria
      description: Specify observable, binary-checkable outcomes across public interfaces that verify this ticket. Mention specific CLI commands, routes, or status codes only when that external interface is itself part of the contract.
      placeholder: |
        - [ ] Automated tests pass
        - [ ] Behavioral contract holds across public interfaces
    validations:
      required: true
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Ticket Invariants
      description: "Verify ticket lifecycle invariants:"
      options:
        - label: I confirm this ticket represents an atomic vertical slice deliverable in a single session/PR.
          required: true
        - label: I will link this ticket to its parent Spec using native sub-issues and will not assign a milestone directly to this ticket.
          required: true
