name: Spec
description: Track a capability, milestone epic, or multi-slice effort
type: Feature
labels: ["type:spec"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Overview and problem
      description: What capability this introduces and what concrete problem or user need it solves.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Expected outcome and acceptance criteria
      description: Observable outcomes that prove this spec is complete.
      placeholder: |
        - [ ] Automated verification passes
        - [ ] All child tickets delivered and verified
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Scope and boundaries
      description: Optional out-of-scope items, non-functional limits, or cross-module boundaries.
