name: Ticket
description: Track an actionable slice, fix, refactor, test, or docs task
type: Task
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Concrete defect, gap, or motivation for this change.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Observable behavior across public interfaces when done, without prescribing internal code paths or steps.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable checks proving the expected outcome holds.
      placeholder: |
        - [ ] <Observable behavior proving the expected outcome holds>
    validations:
      required: true
