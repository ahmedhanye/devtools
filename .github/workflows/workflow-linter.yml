name: Workflow Lint & Security

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
      - "scripts/**/*.sh"
      - ".agents/**/*.sh"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
      - "scripts/**/*.sh"
      - ".agents/**/*.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Actionlint & ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.7 --repo rhysd/actionlint --pattern 'actionlint_1.7.7_linux_amd64.tar.gz' --pattern 'actionlint_1.7.7_checksums.txt'
          grep 'actionlint_1.7.7_linux_amd64.tar.gz' actionlint_1.7.7_checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz -C "$HOME/.local/bin" actionlint
          rm actionlint_1.7.7_linux_amd64.tar.gz actionlint_1.7.7_checksums.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run actionlint with embedded ShellCheck
        run: actionlint -color

  zizmor:
    name: Zizmor Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor static analyzer
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
