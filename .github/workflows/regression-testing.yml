name: Regression Testing

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  FALLOW_TELEMETRY_DISABLED: "1"
  REACT_DOCTOR_NO_TELEMETRY: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      site: ${{ steps.filter.outputs.site }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout repository (push only)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig*.json'
              - '.github/**'
              - '.oxlintrc.json'
              - '.fallowrc.json'
              - '.fallow/**'
              - 'lefthook.yml'
              - '.agents/**'
              - 'skills-lock.json'
            site:
              - 'site/**'
            scripts:
              - 'scripts/**'

  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Verify formatting (Prettier)
        run: bun run format:check

      - name: Run root Oxlint
        run: bun run lint

      - name: Run Steiger FSD architecture linting
        run: bun run lint:fsd

      - name: Run frontend design tokens linting
        run: bun run lint:design

      - name: Verify agent skills and rules
        run: bun run lint:agents

  architecture-and-health:
    name: Architecture & Health
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Verify architecture boundaries and dead code (Fallow)
        run: bun run fallow:dead-code

      - name: Verify duplication baseline (Fallow)
        if: github.event_name == 'pull_request'
        run: bun run fallow:dupes

      - name: Scan React regressions (React Doctor)
        if: github.event_name == 'pull_request'
        run: bun run react-doctor

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Run typecheck across all workspaces
        run: bun run typecheck

  test-and-coverage:
    name: Test & Coverage Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.scripts == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # Required for posting/updating sticky PR coverage comment
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Build frontend static assets
        run: bun --filter @devtools/frontend build

      - name: Execute test suites with coverage aggregation
        run: bun run test:coverage

      - name: Verify 100% diff coverage gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/verify-diff-coverage.ts --base "origin/${BASE_REF}" --output coverage/diff-coverage-summary.md

      - name: Post or update sticky PR coverage comment
        if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'coverage/diff-coverage-summary.md';
            if (!fs.existsSync(summaryPath)) {
              return;
            }
            const summary = fs.readFileSync(summaryPath, 'utf8');
            const header = '<!-- devtools-diff-coverage -->';
            const body = `${header}\n${summary}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const botComment = comments.find(comment => comment.body && comment.body.includes(header));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Build Next.js static production export
        run: bun --filter @devtools/frontend build

      - name: Build Storybook static production bundle
        run: bun --filter @devtools/frontend build-storybook

      - name: Compile and smoke test host CLI binary
        run: bun run build:smoke

      - name: Cross-compile standalone CLI for darwin-arm64
        run: bun run build:darwin-arm64
