name: Regression Testing

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  FALLOW_TELEMETRY_DISABLED: "1"
  REACT_DOCTOR_NO_TELEMETRY: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      frontend: ${{ steps.filter.outputs.frontend }}
      site: ${{ steps.filter.outputs.site }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Checkout repository (push only)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.fallowrc.json'
              - '.fallow/**'
              - 'fallow-baselines/**'
              - 'doctor.config.json'
              - 'lefthook.yml'
              - 'turbo.json'
            frontend:
              - 'apps/frontend/**'
              - 'packages/core/**'
              - 'packages/lighthouse/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig*.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'doctor.config.json'
              - 'turbo.json'
            site:
              - 'site/**'
            scripts:
              - 'scripts/**'

  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: $/.github/actions/setup-bun

      - name: Verify formatting (Oxfmt)
        run: bun run format:check

      - name: Run root Oxlint
        run: bun run lint

      - name: Run Steiger FSD architecture linting
        if: needs.changes.outputs.frontend == 'true'
        run: bun run lint:fsd

      - name: Verify agent skills and rules
        run: bun run lint:agents

  architecture-and-health:
    name: Architecture & Health
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun environment
        uses: $/.github/actions/setup-bun

      - name: Verify dead code, boundaries, private type leaks, health, and duplication (Fallow)
        run: bun run fallow:check

      - name: Verify database schema and migration parity
        run: bun run verify:db-migrations

      - name: Verify new security sinks (Fallow)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bunx fallow security --gate new --changed-since "origin/${BASE_REF}" --workspace 'apps/*,packages/*,site'

      - name: Verify new security sinks on push (Fallow)
        if: github.event_name == 'push'
        run: bunx fallow security --gate new --changed-since HEAD~1 --workspace 'apps/*,packages/*,site'

      - name: Scan React design regressions (React Doctor)
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.site == 'true'
        run: bun run react-doctor:design

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: $/.github/actions/setup-bun

      - name: Restore Turborepo cache
        uses: actions/cache@v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-typecheck-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-typecheck-

      - name: Run typecheck across all workspaces
        run: bun run typecheck

  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: $/.github/actions/setup-bun

      - name: Restore Turborepo cache
        uses: actions/cache@v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-build-

      - name: Build Next.js static production export
        if: needs.changes.outputs.frontend == 'true'
        run: bunx turbo run build --filter=@devtools/frontend

      - name: Build documentation site production bundle
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
        run: bunx turbo run build --filter=@devtools/site

      - name: Build Storybook static production bundle
        if: needs.changes.outputs.frontend == 'true'
        run: bunx turbo run build-storybook --filter=@devtools/frontend

      - name: Compile and smoke test host CLI binary
        if: needs.changes.outputs.code == 'true'
        run: bun run build:smoke

      - name: Cross-compile standalone CLI for darwin-arm64
        if: needs.changes.outputs.code == 'true'
        run: bun run build:darwin-arm64

      - name: Upload built CLI binary for coverage tests
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-build-outputs
          path: |
            dist/devtools
          retention-days: 1
          if-no-files-found: error

  test-and-coverage:
    name: Test & Coverage Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - build
    if: always() && (needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.scripts == 'true') && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # Required for posting/updating sticky PR coverage comment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun environment
        uses: $/.github/actions/setup-bun

      - name: Restore Turborepo cache
        uses: actions/cache@v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-test-

      - name: Download prebuilt CLI binary
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: ci-build-outputs
          path: dist

      - name: Restore executable permissions on CLI binary
        if: needs.changes.outputs.code == 'true'
        run: chmod +x dist/devtools

      - name: Execute script unit tests (scripts-only change)
        if: needs.changes.outputs.code != 'true' && needs.changes.outputs.site != 'true' && needs.changes.outputs.scripts == 'true'
        run: bun test scripts/

      - name: Execute test suites with coverage aggregation
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
        run: bun run test:coverage

      - name: Verify 100% diff coverage gate
        if: github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run verify:diff-coverage --base "origin/${BASE_REF}" --output coverage/diff-coverage-summary.md

      - name: Post or update sticky PR coverage comment
        if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && (needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true')
        continue-on-error: true
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'coverage/diff-coverage-summary.md';
            if (!fs.existsSync(summaryPath)) {
              return;
            }
            const summary = fs.readFileSync(summaryPath, 'utf8');
            const header = '<!-- devtools-diff-coverage -->';
            const body = `${header}\n${summary}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const botComment = comments.find(comment => comment.body && comment.body.includes(header));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
