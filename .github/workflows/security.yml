name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday audit at 04:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  FALLOW_TELEMETRY_DISABLED: "1"
  REACT_DOCTOR_NO_TELEMETRY: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependencies: ${{ steps.filter.outputs.dependencies }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository (push only)
        if: github.event_name == 'push'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed files
        if: github.event_name != 'schedule'
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            dependencies:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              - 'site/package.json'
            code:
              - 'apps/**'
              - 'packages/**'
              - 'site/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - '.github/actions/**'

  dependency-audit:
    name: Dependency Audit & Review
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.dependencies == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Run transitive lockfile audit (Bun)
        run: bun run audit

      - name: Dependency Review Gate
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  secret-scanning:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.99.2 --repo trufflesecurity/trufflehog --pattern 'trufflehog_3.99.2_linux_amd64.tar.gz'
          echo "3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4  trufflehog_3.99.2_linux_amd64.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf trufflehog_3.99.2_linux_amd64.tar.gz -C "$HOME/.local/bin" trufflehog
          rm trufflehog_3.99.2_linux_amd64.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: TruffleHog OSS (Incremental PR Scan)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          trufflehog git file://. \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --github-actions \
            --results=verified,unknown \
            --exclude-paths=.github/trufflehog-exclude.txt

      - name: TruffleHog OSS (Incremental Push Scan)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            trufflehog git file://. \
              --since-commit "$BEFORE" \
              --branch "$AFTER" \
              --fail \
              --no-update \
              --github-actions \
              --results=verified,unknown \
              --exclude-paths=.github/trufflehog-exclude.txt
          else
            trufflehog git file://. \
              --branch "$AFTER" \
              --fail \
              --no-update \
              --github-actions \
              --results=verified,unknown \
              --exclude-paths=.github/trufflehog-exclude.txt
          fi

      - name: TruffleHog OSS (Scheduled Full History Scan)
        if: github.event_name == 'schedule'
        run: |
          trufflehog git file://. \
            --fail \
            --no-update \
            --github-actions \
            --results=verified,unknown \
            --exclude-paths=.github/trufflehog-exclude.txt

  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
