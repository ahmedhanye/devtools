name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  FALLOW_TELEMETRY_DISABLED: "1"
  REACT_DOCTOR_NO_TELEMETRY: "1"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required for creating release tags, notes, and releases
      pull-requests: write # Required for creating and updating the candidate release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build-binaries:
    name: Build Standalone Binary (${{ matrix.target.name }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout repository code
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: devtools-linux-x64
            bun-target: bun-linux-x64
          - name: devtools-linux-arm64
            bun-target: bun-linux-arm64
          - name: devtools-darwin-arm64
            bun-target: bun-darwin-arm64
          - name: devtools-darwin-x64
            bun-target: bun-darwin-x64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Compile standalone executable
        env:
          TARGET: ${{ matrix.target.bun-target }}
          OUTFILE: dist/${{ matrix.target.name }}
        run: |
          mkdir -p dist
          bun build apps/cli/bin/devtools.js --compile --minify --bytecode --format=esm --target="$TARGET" --outfile="$OUTFILE"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target.name }}
          path: dist/${{ matrix.target.name }}
          if-no-files-found: error

  publish-release-assets:
    name: Publish Release Assets
    needs:
      - release-please
      - build-binaries
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required for uploading binary assets and checksums to GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443

      - name: Download binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "devtools-*"
          path: dist
          merge-multiple: true

      - name: Verify binary artifacts and generate checksums
        working-directory: dist
        run: |
          test -s devtools-linux-x64 && test -s devtools-linux-arm64
          test -s devtools-darwin-arm64 && test -s devtools-darwin-x64
          sha256sum devtools-linux-x64 devtools-linux-arm64 devtools-darwin-arm64 devtools-darwin-x64 > SHA256SUMS.txt

      - name: Upload assets to GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" devtools-* SHA256SUMS.txt --clobber
