# lefthook.yml
# Fast, parallel git pre-commit and commit-msg quality gates
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    lint-and-format:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --bun oxlint --fix {staged_files} && bunx --bun prettier --write {staged_files}
      stage_fixed: true

    format-docs:
      glob: "*.{json,css,md,yml,yaml}"
      run: bunx --bun prettier --write {staged_files}
      stage_fixed: true

    react-doctor:
      glob: "{apps/frontend,site}/**/*.{js,jsx,ts,tsx}"
      run: bunx react-doctor --project apps/frontend,site -y --no-telemetry --no-supply-chain --blocking error {staged_files}

    test-staged-ui:
      glob: "apps/frontend/src/**/*.{ts,tsx}"
      run: bun --filter @devtools/frontend test

    verify-secrets:
      run: bun scripts/verify-staged-secrets.ts {staged_files}

    verify-agents-governance:
      glob: "{.agents/*.md,.agents/**/*.md}"
      run: bun .agents/skills/writing-for-agents/scripts/verify-agents-governance.ts {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: bunx commitlint --edit {1}
