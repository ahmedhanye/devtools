# lefthook.yml
# Fast staged pre-commit gate, conventional commit-msg check, and cached full pre-push verification
# https://lefthook.dev/configuration/

pre-commit:
  jobs:
    - name: auto-fix
      group:
        piped: true
        jobs:
          - name: oxlint-fix
            glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
            run: bunx oxlint --deny-warnings --report-unused-disable-directives --fix {staged_files}
            stage_fixed: true
          - name: oxfmt-fix
            run: bunx oxfmt --no-error-on-unmatched-pattern --write {staged_files}
            stage_fixed: true
    - name: staged-checks
      group:
        parallel: true
        jobs:
          - name: staged-secrets
            run: bun scripts/verify-staged-secrets/verify-staged-secrets.ts {staged_files}
          - name: lint-agents
            glob: ".agents/**/*.md"
            run: bun run lint:agents {staged_files}
          - name: verify-db-migrations
            glob: "packages/db/{src/schema/**,drizzle/**,drizzle.config.ts,src/migrator.ts}"
            run: bun run verify:db-migrations --check-git-status
          - name: verify-actions-lock
            glob: ".github/{workflows,actions}/**"
            run: bun run verify:actions-lock
          - name: lint-workflows
            glob: "{.github/**,**/*.sh}"
            run: bun run lint:workflows

commit-msg:
  jobs:
    - name: conventional-commits
      run: bunx --bun commitlint --edit {1}

pre-push:
  jobs:
    - name: push-checks
      group:
        piped: true
        jobs:
          - name: verify-push-secrets
            run: bun run verify:push-secrets
          - name: verify-full
            run: bun run verify
